baseURL = "https://example.org/"
locale = "en"
title = "My Notes"
theme = "damodar"

[outputs]
  home = ["HTML", "RSS", "JSON"] # "JSON" enables client-side search fallback

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  logo = "/logo.svg"          # file in static/ ; remove to show only the site title
  tagline = "Notes on building things."
  showRecent = true           # recent posts on home page
  recentCount = 5
  footerText = "Notes on building things."
  copyright = ""              # leave empty for default (© current year Title)
  twitter = ""                # e.g. "@username"
  ogImage = ""                # path to default social share card image
  # Sidebar section headings (defaults: "ON THIS PAGE" for TOC, "NAVIGATION" for site sections)
  tocTitle = "ON THIS PAGE"
  navigationTitle = "NAVIGATION"
  # Repository link for "Edit this page" action (hidden by default, set showEditPage = true to enable)
  repo = "https://github.com/username/my-site"
  repoBranch = "main"
  showEditPage = false

  [params.author]
    name = "Author Name"
    bio = "Engineer, writer, and open-source enthusiast."
    avatar = "/avatar.jpg"
    github = "username"
    twitter = "username"
    website = "https://example.org"

  # Comments via Giscus
  # [params.giscus]
  #   repo = "yourusername/your-repo"
  #   repoId = "R_kgDO..."
  #   category = "Announcements"
  #   categoryId = "DIC_kwDO..."
  #   mapping = "pathname"
  #   theme = "preferred_color_scheme"
  #   lang = "en"

  # Or comments via Utterances
  # [params.utterances]
  #   repo = "yourusername/your-repo"
  #   issueTerm = "pathname"
  #   theme = "preferred-color-scheme"

  # Privacy-friendly analytics
  # [params.plausible]
  #   domain = "example.org"

  # [params.cloudflareAnalytics]
  #   token = "your-token"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  guessSyntax = true
  lineNos = false
  tabWidth = 2

# Links shown in the full-width footer
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menus.main]]
  name = "Archive"
  url = "/archive/"
  weight = 3
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 4
[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5
