baseURL = "https://example.org/"
locale = "en"
title = "My Notes"
theme = "damodar"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  logo = "/logo.svg"          # file in static/ ; remove to show only the site title
  tagline = "Notes on building things."
  showRecent = true           # recent posts on home page
  recentCount = 5
  footerText = "Notes on building things."
  copyright = ""              # leave empty for default (© current year Title)
  twitter = ""                # e.g. "@username"
  ogImage = ""                # path to default social share card image
  termsDescription = "Browse all topics and tags."
  repo = "https://github.com/kunalgautam/damodar"
  repoBranch = "master"
  showEditPage = false

  [params.author]
    name = "Damodar Team"
    bio = "Technical writers and engineers designing high-performance Hugo documentation."
    avatar = "/logo.svg"
    github = "kunalgautam"
    website = "https://example.org"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  guessSyntax = true
  lineNos = false
  tabWidth = 2

# Links shown in the full-width footer
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menus.main]]
  name = "Archive"
  url = "/archive/"
  weight = 3
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 4
[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5
