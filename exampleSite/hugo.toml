baseURL = "https://example.org/"
languageCode = "en"
title = "My Notes"
theme = "damodar"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  logo = "/logo.svg"          # file in static/ ; remove to show only the site title
  tagline = "Notes on building things."
  showRecent = true           # recent posts on home page
  recentCount = 5

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.highlight]
  noClasses = false
  guessSyntax = true
  lineNos = false
  tabWidth = 2

# Links shown at the bottom of the sidebar
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 3
[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 4
