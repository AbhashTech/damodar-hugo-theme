<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search" data-pagefind-ignore data-pagefind-path="{{ "pagefind/pagefind.js" | relURL }}" data-index="{{ with site.Home.OutputFormats.Get "json" }}{{ .RelPermalink }}{{ else }}{{ "index.json" | relURL }}{{ end }}" hidden>
  <div class="search-backdrop" id="search-backdrop"></div>
  <div class="search-box">
    <div class="search-header">
      <svg class="ic-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="search-input" class="search-input" placeholder="Search documentation, notes, tags..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="search-close" id="search-close" type="button" aria-label="Close search (Esc)">&times;</button>
    </div>
    <div class="search-body">
      <ul class="search-results" id="search-results" role="listbox"></ul>
      <div class="search-empty" id="search-empty" hidden>No results found for "<span id="search-query-text"></span>"</div>
      <div class="search-error" id="search-error" hidden></div>
      <div class="search-initial" id="search-initial">Type to start searching...</div>
    </div>
    <div class="search-footer">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Navigate</span>
      <span><kbd>&crarr;</kbd> Select</span>
      <span><kbd>esc</kbd> Close</span>
    </div>
  </div>
</div>
