<dialog id="shortcuts-modal" class="shortcuts-modal" aria-label="Keyboard Shortcuts">
  <div class="shortcuts-modal-card">
    <div class="shortcuts-modal-header">
      <h3 class="shortcuts-modal-title">Keyboard Shortcuts</h3>
      <button type="button" class="shortcuts-modal-close" aria-label="Close shortcuts modal">&times;</button>
    </div>
    <div class="shortcuts-list">
      <div class="shortcut-item">
        <span class="shortcut-desc">Open search dialog</span>
        <span class="shortcut-keys"><kbd>⌘K</kbd> <span class="shortcut-or">or</span> <kbd>/</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Toggle light / dark mode</span>
        <span class="shortcut-keys"><kbd>T</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Next article</span>
        <span class="shortcut-keys"><kbd>J</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Previous article</span>
        <span class="shortcut-keys"><kbd>K</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Navigate to home page</span>
        <span class="shortcut-keys"><kbd>H</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Keyboard shortcuts reference</span>
        <span class="shortcut-keys"><kbd>?</kbd></span>
      </div>
      <div class="shortcut-item">
        <span class="shortcut-desc">Close dialog / modal</span>
        <span class="shortcut-keys"><kbd>Esc</kbd></span>
      </div>
    </div>
  </div>
</dialog>
