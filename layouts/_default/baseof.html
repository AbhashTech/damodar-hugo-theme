<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body id="top" class="{{ if .IsHome }}is-home{{ else if .IsPage }}is-post{{ else }}is-list{{ end }}">
  <a class="skip" href="#content">Skip to content</a>
  <div class="top-nav-mobile" data-pagefind-ignore>
    <button class="mobile-search-btn search-trigger" type="button" aria-label="Search site" title="Search (⌘K or /)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
    <button class="menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false">Menu</button>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar" data-pagefind-ignore>{{ partial "sidebar.html" . }}</aside>
    <main class="content" id="content" data-pagefind-body>{{ block "main" . }}{{ end }}</main>
  </div>
  {{ partial "footer.html" . }}
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>
  {{ partial "search-modal.html" . }}
  {{ partial "shortcuts-modal.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
